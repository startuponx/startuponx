  <meta name="twitter:title" content="StartupOnX India — Submit your startup ₹149/mo" />

  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* Annotation — arrow LEFT of text, both on right side of page */
    .hero-annotation {
      position: absolute;
      top: 48px;
      right: 40px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      user-select: none;
    }
    .annotation-arrow {
      flex-shrink: 0;
    }
    .annotation-text {
      transform: rotate(-8deg);
      font-size: 20px;
      font-weight: 700;
      color: #1d6aff;
      font-style: italic;
      line-height: 1.3;
      white-space: nowrap;
    }
    @media (max-width: 700px) {
      .hero-annotation { display: none; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-brand">startuponx<span>.in</span></a>
  <div class="nav-center">
    <a href="about.html">About</a>
    <a href="how-it-works.html">How it works</a>
    <a href="contact.html">Contact</a>
  </div>
  <div class="nav-right" id="nav-auth">
    <a href="signin.html" class="btn btn-black">Sign in</a>
  </div>
</nav>

<header class="hero">
  <h1>Submit your startup</h1>
  <div class="hero-price">₹149/mo</div>
  <p class="hero-sub">For founders building and sharing their startups on X 🇮🇳</p>
  <div class="hero-cta-row">
    <a href="submit.html" class="btn btn-black">Get listed</a>
    <span class="hero-lock">First 25 lock in ₹149/mo. After that, ₹299/mo.</span>
  </div>
  <p class="hero-live" id="live-count"></p>

  <!-- Arrow on LEFT of text, both sitting on right side of page -->
  <div class="hero-annotation" aria-hidden="true">
    <!-- Arrow: curves from right-to-left, tip points LEFT toward ₹149 -->
    <svg class="annotation-arrow" viewBox="0 0 120 60" fill="none"
         style="width:110px;height:50px;color:#1d6aff;"
         xmlns="http://www.w3.org/2000/svg">
      <!-- Dashed curve: starts top-right, ends bottom-left -->
      <path d="M115 8 C85 4, 35 22, 8 48"
            stroke="currentColor" stroke-width="2"
            stroke-dasharray="4 6" stroke-linecap="round" fill="none"/>
      <!-- Arrowhead pointing bottom-left -->
      <path d="M8 48 L18 40 M8 48 L16 56"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <!-- Text on the RIGHT of the arrow -->
    <p class="annotation-text">One-fifty.<br/>Stay listed.</p>
  </div>
</header>

<div class="filter-bar" role="toolbar">
  <button class="filter-tab active" data-filter="all">All</button>
  <button class="filter-tab" data-filter="ai">AI</button>
  <button class="filter-tab" data-filter="developer-tools">Developer Tools</button>
  <button class="filter-tab" data-filter="design">Design</button>
  <button class="filter-tab" data-filter="saas">SaaS</button>
  <button class="filter-tab" data-filter="marketing">Marketing</button>
  <button class="filter-tab" data-filter="fintech">Fintech</button>
  <button class="filter-tab" data-filter="productivity">Productivity</button>
  <button class="filter-tab" data-filter="other">Other</button>
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="search" class="search-input" id="search" placeholder="Search startups..." aria-label="Search startups" />
  </div>
</div>

<main>
  <div class="grid-wrap">
    <div class="startup-grid" id="grid">
      <div class="empty-state" id="empty" style="display:none">
        No startups yet. <a href="submit.html" style="color:var(--black);text-decoration:underline">Be the first.</a>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-left">
      <img src="logo.png" alt="" aria-hidden="true" />
      © <span id="yr"></span> StartupOnX India
    </div>
    <div class="footer-links">
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </div>
  </div>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBo0znzdeRwlclOvrSouUzRja4yFHUu6Tc",
    authDomain: "startuponx-e228c.firebaseapp.com",
    projectId: "startuponx-e228c",
    storageBucket: "startuponx-e228c.firebasestorage.app",
    messagingSenderId: "333136775467",
    appId: "1:333136775467:web:30ccb507b40a13b1cc9d6e",
    measurementId: "G-9MJEJT5ELL"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  document.getElementById('yr').textContent = new Date().getFullYear();

  // Nav auth state
  onAuthStateChanged(auth, function(user) {
    var navAuth = document.getElementById('nav-auth');
    if (user) {
      navAuth.innerHTML =
        '<a href="my-listings.html" class="btn btn-outline">My listings</a>' +
        '<button class="btn btn-black" id="signout-btn">Sign out</button>';
      document.getElementById('signout-btn').addEventListener('click', function() {
        signOut(auth);
      });
    } else {
      navAuth.innerHTML = '<a href="signin.html" class="btn btn-black">Sign in</a>';
    }
  });

  // Load live startups
  async function loadStartups() {
    var grid    = document.getElementById('grid');
    var empty   = document.getElementById('empty');
    var countEl = document.getElementById('live-count');

    try {
      var q    = query(collection(db, 'startups'), where('status', '==', 'live'));
      var snap = await getDocs(q);
      var startups = [];
      snap.forEach(function(doc) {
        startups.push(Object.assign({ id: doc.id }, doc.data()));
      });

      var n = startups.length;
      countEl.textContent = n + ' startup' + (n !== 1 ? 's' : '') + ' live';

      if (n === 0) { empty.style.display = 'block'; return; }

      startups.forEach(function(s) {
        var rawUrl  = s.website || s.url || '';
        var siteUrl = rawUrl.startsWith('http') ? rawUrl : 'https://' + rawUrl;

        var logoHtml = s.logoUrl
          ? '<img class="card-logo" src="' + s.logoUrl + '" alt="' + (s.name || '') + ' logo" width="52" height="52" />'
          : '<div class="card-logo-letter" aria-hidden="true">' + (s.name || '?')[0].toUpperCase() + '</div>';

        var descText   = s.desc || s.description || '';
        var catRaw     = s.category || 'other';
        var catSlug    = catRaw.toLowerCase().replace(/\s+/g, '-');
        var catDisplay = catRaw.charAt(0).toUpperCase() + catRaw.slice(1);

        var card = document.createElement('article');
        card.className = 'startup-card';
        card.dataset.category = catSlug;
        card.dataset.name = (s.name || '').toLowerCase();
        card.innerHTML =
          '<div class="card-header">' +
            logoHtml +
            '<div class="card-info">' +
              '<div class="card-name">' + (s.name || '') + '</div>' +
              '<p class="card-desc">' + descText + '</p>' +
            '</div>' +
          '</div>' +
          '<span class="card-tag">' + catDisplay + '</span>' +
          '<a href="' + siteUrl + '" class="card-visit" target="_blank" rel="noopener noreferrer">Visit site</a>';

        grid.insertBefore(card, empty);
      });

    } catch (err) {
      console.error('Firestore load error:', err);
      countEl.textContent = '';
      empty.style.display = 'block';
      empty.innerHTML = 'Could not load startups. <a href="submit.html" style="color:var(--black);text-decoration:underline">Submit yours.</a>';
    }
  }

  loadStartups();

  // Filter + Search
  var tabs        = document.querySelectorAll('.filter-tab');
  var searchInput = document.getElementById('search');

  function applyFilters() {
    var active  = (document.querySelector('.filter-tab.active') || {}).dataset || {};
    var filter  = active.filter || 'all';
    var q       = searchInput.value.trim().toLowerCase();
    var cards   = document.querySelectorAll('.startup-card');
    var visible = 0;

    cards.forEach(function(c) {
      var matchCat    = filter === 'all' || c.dataset.category === filter;
      var descEl      = c.querySelector('.card-desc');
      var descText    = descEl ? descEl.textContent.toLowerCase() : '';
      var matchSearch = !q || c.dataset.name.includes(q) || descText.includes(q);
      var show        = matchCat && matchSearch;
      c.style.display = show ? '' : 'none';
      if (show) visible++;
    });

    document.getElementById('empty').style.display = visible === 0 ? 'block' : 'none';
  }

  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      applyFilters();
    });
  });

  searchInput.addEventListener('input', applyFilters);
</script>

</body>
</html>
