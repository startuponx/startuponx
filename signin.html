<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — StartupOnX India</title>
  <meta name="description" content="Sign in to StartupOnX India to submit and manage your startup listing." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://startuponx.com/signin.html" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-brand">startuponx<span>.com</span></a>
  <div class="nav-center">
    <a href="about.html">About</a>
    <a href="how-it-works.html">How it works</a>
    <a href="contact.html">Contact</a>
    
  </div>
  <div class="nav-right">
    <a href="signin.html" class="btn btn-black">Sign in</a>
  </div>
</nav>

<main>
  <div class="signin-wrap">
    <h1>Sign in</h1>
    <p>Sign in to submit and manage your startup listing.</p>
    <button class="btn-google" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
      Continue with Google
    </button>
    <p style="margin-top:20px;font-size:13px;color:var(--muted)">
      By signing in you agree to our <a href="terms.html" style="color:var(--black);text-decoration:underline">terms</a>.
    </p>
  </div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-left"><img src="logo.png" alt="" aria-hidden="true" /> © <span id="yr"></span> StartupOnX India</div>
    <div class="footer-links"><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div>
  </div>
</footer>

<script type="module">
  import { signInWithGoogle, onAuth } from './js/firebase.js';
  document.getElementById('yr').textContent = new Date().getFullYear();

  // If already signed in, go to my-listings
  onAuth(user => { if (user) window.location.href = 'my-listings.html'; });

  document.getElementById('google-btn').addEventListener('click', async () => {
    try {
      await signInWithGoogle();
      window.location.href = 'my-listings.html';
    } catch(e) {
      alert('Sign-in failed. Please try again.');
    }
  });
</script>
</body>
</html>
