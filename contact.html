  <!-- JavaScript -->

  <script type="module">

    /*
     * Firebase authentication
     */
    import {
      onAuth,
      signOutUser
    } from './js/firebase.js';


    /*
     * Current year
     */
    document.querySelectorAll('.yr').forEach(el => {
      el.textContent = new Date().getFullYear();
    });


    /*
     * Navigation authentication state
     */
    onAuth(user => {

      const nav = document.getElementById('nav-auth');

      if (!nav) return;


      if (user) {

        nav.innerHTML = `
          <a href="my-listings.html" class="btn btn-outline">
            My listings
          </a>

          <button
            class="btn btn-black"
            id="so"
            type="button"
          >
            Sign out
          </button>
        `;


        const signOutButton = document.getElementById('so');

        if (signOutButton) {
          signOutButton.addEventListener('click', async () => {
            try {
              await signOutUser();
            } catch (error) {
              console.error('Sign out error:', error);
              alert('Could not sign out. Please try again.');
            }
          });
        }

      } else {

        nav.innerHTML = `
          <a href="signin.html" class="btn btn-black">
            Sign in
          </a>
        `;

      }

    });


    /*
     * Contact form
     */
    const contactForm = document.getElementById('contact-form');

    if (contactForm) {

      contactForm.addEventListener('submit', function (e) {

        e.preventDefault();


        const emailInput = document.getElementById('email');
        const messageInput = document.getElementById('message');
        const success = document.getElementById('success');


        const email = emailInput.value.trim();
        const message = messageInput.value.trim();


        /*
         * Check required fields
         */
        if (!email || !message) {
          alert('Please fill in both fields.');
          return;
        }


        /*
         * Basic email validation
         */
        const emailPattern =
          /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {
          alert('Please enter a valid email address.');
          emailInput.focus();
          return;
        }


        /*
         * Prepare email
         */
        const subject =
          encodeURIComponent(
            'Message from StartupOnX — ' + email
          );

        const body =
          encodeURIComponent(
            message +
            '\n\n' +
            'From: ' + email
          );


        /*
         * Open the visitor's default email application.
         *
         * This does NOT automatically send the email.
         * The visitor must press Send in their email app.
         */
        const mailto =
          'mailto:startuponx@gmail.com' +
          '?subject=' + subject +
          '&body=' + body;


        window.location.href = mailto;


        /*
         * Change the page message after opening
         * the email application.
         */
        setTimeout(() => {

          contactForm.style.display = 'none';

          if (success) {
            success.style.display = 'block';
          }

        }, 500);

      });

    }

  </script>
