<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — StartupOnX India</title>
  <meta name="description" content="StartupOnX India is a simple directory of startups Indian founders are building. Pay ₹149/mo to get listed. No ranking by money. No algorithm." />
  <link rel="canonical" href="https://startuponx.com/about.html" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-brand">startuponx<span>.com</span></a>
  <div class="nav-center">
    <a href="about.html" class="active">About</a>
    <a href="how-it-works.html">How it works</a>
    <a href="contact.html">Contact</a>
    <a href="discover.html">Discover</a>
  </div>
  <div class="nav-right" id="nav-auth"><a href="signin.html" class="btn btn-black">Sign in</a></div>
</nav>
<main>
  <div class="simple-page">
    <h1>About</h1>
    <p class="page-sub">startuponx.com is a simple directory of startups Indian founders are building. Pay ₹149/mo to get listed. No ranking by money. No algorithm.</p>
  </div>
</main>
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-left"><img src="logo.png" alt="" aria-hidden="true" /> © <span class="yr"></span> StartupOnX India</div>
    <div class="footer-links"><a href="blog.html">Blog</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div>
  </div>
</footer>
<script type="module">
  import { onAuth, signOutUser } from './js/firebase.js';
  document.querySelectorAll('.yr').forEach(el => el.textContent = new Date().getFullYear());
  onAuth(user => {
    const nav = document.getElementById('nav-auth');
    if (user) { nav.innerHTML = `<a href="my-listings.html" class="btn btn-outline">My listings</a><button class="btn btn-black" id="so">Sign out</button>`; document.getElementById('so').onclick = () => signOutUser(); }
    else { nav.innerHTML = `<a href="signin.html" class="btn btn-black">Sign in</a>`; }
  });
</script>
</body>
</html>
